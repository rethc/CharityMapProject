<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registered Charities Map</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      rel="stylesheet"
      crossorigin
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css"
      rel="stylesheet"
      crossorigin
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css"
      rel="stylesheet"
      crossorigin
    />
    <link
      href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"
      rel="stylesheet"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />

    <style>
      .leaflet-popup-content .addr-pop {
        line-height: 1.25;
        font-size: 12px;
        max-width: 240px;
      }
      .leaflet-popup-content .addr-pop strong {
        display: block;
        margin-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <div id="charity-panel" class="charity-panel" aria-live="polite">
      <button id="panel-close" class="panel-close" aria-label="Close">×</button>
      <div id="panel-content" class="panel-content"></div>
    </div>

    <div
      id="charity-search-container"
      class="leaflet-control-geocoder leaflet-bar leaflet-control"
    >
      <button
        class="leaflet-control-geocoder-icon"
        id="charity-search-btn"
        type="button"
        aria-label="Search"
      >
        &nbsp;
      </button>
      <div class="leaflet-control-geocoder-form">
        <input
          id="charity-search-input"
          class="leaflet-control-geocoder-input"
          type="text"
          placeholder="Search by Charity Registration (CC number)"
        />
      </div>
      <div class="leaflet-control-geocoder-form-no-error">Nothing found.</div>
      <ul
        class="leaflet-control-geocoder-alternatives leaflet-control-geocoder-alternatives-minimized"
      ></ul>
    </div>

    <div id="map"></div>
    <div id="loading-spinner"></div>
    <div id="toast" class="toast">Search moved to:</div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
      crossorigin
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"
      crossorigin
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/perliedman-leaflet-control-geocoder/3.2.0/Control.Geocoder.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <script>
      // ---------------- Utilities ----------------
      const $ = (id) => document.getElementById(id);
      const n = (v) => (v == null || v === "" ? 0 : Number(v));
      const esc = (s) =>
        String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

      // Accept strings / arrays / objects from OData and turn into readable text
      function textify(v) {
        if (v == null) return "";
        if (Array.isArray(v)) return v.map(textify).filter(Boolean).join(", ");
        if (typeof v === "object") {
          if (Array.isArray(v.results))
            return v.results.map(textify).join(", ");
          if (Array.isArray(v.value)) return v.value.map(textify).join(", ");
          return Object.values(v).map(textify).filter(Boolean).join(", ");
        }
        return String(v);
      }
      function pickText(...vals) {
        for (const v of vals) {
          const t = textify(v).trim();
          if (t) return t;
        }
        return "";
      }

      function showToast(message) {
        const toast = $("toast");
        if (!toast) return;
        toast.textContent = message;
        toast.className = "toast show";
        setTimeout(
          () => (toast.className = toast.className.replace("show", "")),
          3000
        );
      }

      // ---------------- API ----------------
      const API = {
        async org(cc) {
          const r = await fetch(
            `https://charities.co.nz/api/Organisations?cc=${encodeURIComponent(
              cc
            )}`
          );
          if (!r.ok)
            throw new Error(`Organisations ${r.status}: ${await r.text()}`);
          const d = await r.json();
          return Array.isArray(d?.value)
            ? d.value[0]
            : Array.isArray(d?.d?.results)
            ? d.d.results[0]
            : Array.isArray(d?.d)
            ? d.d[0]
            : null;
        },
        async latestReturn(cc) {
          const r = await fetch(
            `https://charities.co.nz/api/GrpOrgLatestReturns?cc=${encodeURIComponent(
              cc
            )}`
          );
          if (!r.ok)
            throw new Error(
              `GrpOrgLatestReturns ${r.status}: ${await r.text()}`
            );
          const d = await r.json();
          return Array.isArray(d?.value)
            ? d.value[0]
            : Array.isArray(d?.d?.results)
            ? d.d.results[0]
            : Array.isArray(d?.d)
            ? d.d[0]
            : null;
        },
      };

      // ---------------- Charts ----------------
      function pieBucketsForIncome(row) {
        return [
          {
            label: "Donations, fundraising and other similar receipts",
            value: n(row.DonationsKoha),
          },
          {
            label:
              "Fees, subscriptions and other receipts (including donations) from members",
            value: n(row.MembershipFees),
          },
          {
            label: "Receipts from providing goods or services",
            value: n(row.ServiceTradingIncome),
          },
          {
            label: "Interest, dividends and other investment receipts",
            value: n(row.InterestOfDividendsReceived),
          },
          { label: "Other receipts", value: n(row.AllOtherIncome) },
        ].filter((b) => b.value > 0);
      }
      function pieBucketsForExpenditure(row) {
        return [
          {
            label: "Payments related to public fundraising",
            value: n(row.FundRaisingExpenses),
          },
          {
            label: "Volunteer and employee related expenses",
            value: n(row.VolunteerRelatedExpenses),
          },
          {
            label: "Payments related to providing goods and services",
            value: n(row.CostOfTradingOperations),
          },
          {
            label: "Grants and donations paid",
            value: n(row.GrantsorDonationsPaid),
          },
          {
            label: "Other operating payments",
            value: n(row.AllOtherExpenditure),
          },
        ].filter((b) => b.value > 0);
      }
      function renderPie(canvas, buckets) {
        if (!canvas) return;
        if (!buckets.length) {
          const p = document.createElement("div");
          p.className = "muted";
          p.textContent = "No data";
          canvas.parentElement.replaceWith(p); // replace the whole box
          return;
        }
        new Chart(canvas.getContext("2d"), {
          type: "pie",
          data: {
            labels: buckets.map((b) => b.label),
            datasets: [{ data: buckets.map((b) => b.value) }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false, // the .chart-box drives the aspect ratio
            plugins: {
              legend: { display: false },
              tooltip: {
                displayColors: false,
                callbacks: {
                  label: (ctx) => `$${ctx.parsed.toLocaleString()}`,
                },
              },
            },
          },
        });
      }

      // ---------------- Panel ----------------
      const panel = {
        el: $("charity-panel"),
        content: $("panel-content"),
        open(html) {
          this.content.innerHTML = html;
          this.el.classList.add("open");
          document.body.classList.add("panel-open"); // lock page scroll
        },
        close() {
          this.el.classList.remove("open");
          this.content.innerHTML = "";
          document.body.classList.remove("panel-open"); // unlock page scroll
        },
      };
      $("panel-close").addEventListener("click", () => panel.close());

      function headerBlock(rawHtml) {
        return rawHtml;
      }
      function infoSection(title, value) {
        if (!value) return "";
        return `<div class="panel-section-title">${esc(
          title
        )}</div><div class="muted">${esc(value)}</div>`;
      }

      async function openPanelFor(cc, headerHtml) {
        const [org, ret] = await Promise.all([
          API.org(cc),
          API.latestReturn(cc),
        ]);
        const safe = cc.replace(/[^A-Za-z0-9_-]/g, "");
        const incId = `inc-${safe}`,
          expId = `exp-${safe}`;

        // Use ONLY GrpOrgLatestReturns for these labels
        const purpose = (
          ret?.CharitablePurpose ||
          org?.CharitablePurpose ||
          ""
        ).trim();
        const activities = (ret?.MainActivityName || "").trim();
        const sectors = (ret?.MainSectorName || "").trim();
        const beneficiaries = (ret?.MainBeneficiaryName || "").trim();
        const tierText = ret?.ReportingTier
          ? ret.ReportingTier.replace(/(\D)(\d)/, "$1 $2") // insert space before number
          : "Not available";

        const html = `
  ${headerHtml}
  ${
    purpose
      ? `<div class="panel-section-title">Charitable Purpose</div><div class="muted">${esc(
          purpose
        )}</div>`
      : ""
  }
  ${
    activities
      ? `<div class="panel-section-title">Activities</div><div class="muted">${esc(
          activities
        )}</div>`
      : ""
  }
  ${
    sectors
      ? `<div class="panel-section-title">Sectors</div><div class="muted">${esc(
          sectors
        )}</div>`
      : ""
  }
  ${
    beneficiaries
      ? `<div class="panel-section-title">Beneficiaries</div><div class="muted">${esc(
          beneficiaries
        )}</div>`
      : ""
  }
  ${
    tierText
      ? `<div class="panel-section-title">Reporting Tier</div><div class="muted">${esc(
          tierText
        )}</div>`
      : ""
  }

  <div class="panel-section-title">Operating Income</div>
  <div class="muted" id="inc-total-${safe}"></div>
  <div class="chart-box"><canvas id="${incId}"></canvas></div>

  <div class="panel-section-title">Total Expenditure</div>
  <div class="muted" id="exp-total-${safe}"></div>
  <div class="chart-box"><canvas id="${expId}"></canvas></div>
`;

        panel.open(html);

        if (!ret) return;

        const incBuckets = pieBucketsForIncome(ret);
        const expBuckets = pieBucketsForExpenditure(ret);
        const incTotal =
          n(ret.TotalGrossIncome) ||
          incBuckets.reduce((s, b) => s + b.value, 0);
        const expTotal =
          n(ret.TotalExpenditure) ||
          expBuckets.reduce((s, b) => s + b.value, 0);

        $(
          `inc-total-${safe}`
        ).textContent = `Total receipts: $${incTotal.toLocaleString()}`;
        $(
          `exp-total-${safe}`
        ).textContent = `Total operating payments: $${expTotal.toLocaleString()}`;

        renderPie($(incId), incBuckets);
        renderPie($(expId), expBuckets);
      }

      // ---------------- Map + markers ----------------
      let charityData = [],
        groupData = [];
      const map = L.map("map", {
        attributionControl: true,
        worldCopyJump: true,
        minZoom: 4,
        zoomControl: false,
      }).setView([-40.9006, 174.886], 6);
      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
        {
          attribution:
            'Registered Charities in New Zealand | © <a href="https://carto.com/">Carto</a> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        }
      ).addTo(map);
      map.attributionControl.setPrefix("");

      const charityCluster = L.markerClusterGroup({
        animateAddingMarkers: true,
        showCoverageOnHover: false,
        spiderfyOnMaxZoom: true,
      });
      const groupCluster = L.markerClusterGroup({
        animateAddingMarkers: true,
        showCoverageOnHover: false,
        spiderfyOnMaxZoom: true,
      });
      const combinedCluster = L.markerClusterGroup({
        animateAddingMarkers: true,
        showCoverageOnHover: false,
        spiderfyOnMaxZoom: true,
      });

      function attachMarkerBehaviour(marker, cc, headerHtml, lat, lon) {
        marker.on("click", async () => {
          try {
            if (lat != null && lon != null) {
              map.flyTo([lat, lon], Math.max(map.getZoom(), 14), {
                duration: 0.4,
              });
            }
            await openPanelFor(cc, headerHtml);
          } catch (e) {
            console.warn("Panel data fetch failed:", e);
            panel.open(
              `${headerHtml}<p style="color:#c00;">Couldn’t load data.</p>`
            );
          }
        });
      }

      const spinner = $("loading-spinner");
      let workersDone = 0;
      function workerDone() {
        if (++workersDone === 2 && spinner) spinner.style.display = "none";
      }
      if (spinner) spinner.style.display = "block";

      if (window.Worker) {
        // Charities
        const charityWorker = new Worker("csv-worker.js");
        charityWorker.postMessage({
          csvFile: "combined_charities_data.csv",
          markerType: "charity",
        });
        charityWorker.onmessage = (e) => {
          charityData = e.data;
          const markers = [];
          charityData.forEach((m) => {
            const marker = L.marker([m.lat, m.lon]);
            marker.bindPopup(
              `<div class="addr-pop"><strong>${esc(m.charityName)}</strong>${
                m.streetAddress
              }</div>`,
              { autoPan: false }
            );
            attachMarkerBehaviour(
              marker,
              m.charityRegNumber,
              m.popupContent,
              m.lat,
              m.lon
            );
            markers.push(marker);
            combinedCluster.addLayer(marker);
          });
          charityCluster.addLayers(markers);
          map.addLayer(charityCluster);
          workerDone();
        };

        // Groups
        const groupWorker = new Worker("csv-worker.js");
        groupWorker.postMessage({
          csvFile: "combined_groups_data.csv",
          markerType: "group",
        });
        groupWorker.onmessage = (e) => {
          groupData = e.data;
          const markers = [];
          const greenIcon = new L.Icon({
            iconUrl: "marker-icon-2x-green.png",
            shadowUrl: "marker-shadow.png",
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41],
          });
          groupData.forEach((m) => {
            const marker = L.marker([m.lat, m.lon], { icon: greenIcon });
            marker.bindPopup(
              `<div class="addr-pop"><strong>${esc(m.charityName)}</strong>${
                m.streetAddress
              }</div>`,
              { autoPan: false }
            );
            attachMarkerBehaviour(
              marker,
              m.charityRegNumber,
              m.popupContent,
              m.lat,
              m.lon
            );
            markers.push(marker);
            combinedCluster.addLayer(marker);
          });
          groupCluster.addLayers(markers);
          workerDone();
        };
      }

      L.control
        .layers(
          {
            Charities: charityCluster,
            Groups: groupCluster,
            "Charities and Groups": combinedCluster,
          },
          {},
          { position: "topright" }
        )
        .addTo(map);
      L.control.zoom({ position: "topright" }).addTo(map);

      const HeartSearchControl = L.Control.extend({
        options: { position: "topright" },
        onAdd: () => {
          const el = $("charity-search-container");
          L.DomEvent.disableClickPropagation(el);
          L.DomEvent.disableScrollPropagation(el);
          return el;
        },
      });
      map.addControl(new HeartSearchControl());

      L.Control.geocoder({
        defaultMarkGeocode: false,
        geocoder: L.Control.Geocoder.nominatim(),
        position: "topright",
      })
        .on("markgeocode", (e) => {
          const b = e.geocode.bbox;
          const poly = L.polygon([
            [b.getSouthEast().lat, b.getSouthEast().lng],
            [b.getNorthEast().lat, b.getNorthEast().lng],
            [b.getNorthWest().lat, b.getNorthWest().lng],
            [b.getSouthWest().lat, b.getSouthWest().lng],
          ]).addTo(map);
          map.fitBounds(poly.getBounds());
          showToast("Search moved to: " + e.geocode.name);
        })
        .addTo(map);

      let polygons = [];
      const ClearControl = L.Control.extend({
        options: { position: "topright" },
        onAdd: function () {
          const container = L.DomUtil.create(
            "div",
            "leaflet-bar custom-clear-control"
          );
          const button = L.DomUtil.create("a", "", container);
          button.innerHTML = "Clear";
          button.href = "#";
          button.title = "Clear Search Areas";
          L.DomEvent.on(button, "click", (ev) => {
            L.DomEvent.preventDefault(ev);
            polygons.forEach((p) => map.removeLayer(p));
            polygons = [];
          });
          return container;
        },
      });
      map.addControl(new ClearControl());

      const searchBtn = $("charity-search-btn");
      const searchInput = $("charity-search-input");
      const searchBox = $("charity-search-container");
      searchBtn.addEventListener("click", () => {
        searchBox.classList.toggle("leaflet-control-geocoder-expanded");
        searchInput.focus();
      });
      searchInput.addEventListener("focusout", () => {
        searchBox.classList.remove("leaflet-control-geocoder-expanded");
      });
      searchInput.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const q = searchInput.value.trim();
        if (!q) return;
        const found =
          charityData.find(
            (c) => c.charityRegNumber.toLowerCase() === q.toLowerCase()
          ) ||
          groupData.find(
            (g) => g.charityRegNumber.toLowerCase() === q.toLowerCase()
          );
        if (!found) return showToast("Charity or Group not found.");
        map.setView([found.lat, found.lon], 16);
        const marker = L.marker([found.lat, found.lon]);
        marker.bindPopup(
          `<div class="addr-pop"><strong>${esc(found.charityName)}</strong>${
            found.streetAddress
          }</div>`,
          { autoPan: false }
        );
        attachMarkerBehaviour(
          marker,
          found.charityRegNumber,
          found.popupContent,
          found.lat,
          found.lon
        );
        marker.addTo(map).fire("click");
        searchInput.value = "";
      });
    </script>
  </body>
</html>
